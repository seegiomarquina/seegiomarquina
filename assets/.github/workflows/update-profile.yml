name: Update Neofetch Profile SVG

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate SVG
        env:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_svg.py

      - name: Commit and push updated SVG
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dark_mode.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update neofetch telemetry" && git push)
